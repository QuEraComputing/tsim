name: Metal

# Runs the Metal backend's tests on an Apple GPU before a release; release.yml calls it
# on version tags and publishes only if it passes. The standard macOS runners have only
# a paravirtual GPU, on which Tsim cannot sample, so this uses the paid M2 Pro runner
# (macos-latest-xlarge, GPU acceleration enabled) and runs only the tests that need the
# GPU. Every other test runs on all platforms in ci.yml.

on:
  workflow_call:
  push:  # TEMPORARY: test run, removed before review
    branches: [ci/metal-release]

jobs:
  metal:
    name: Metal tests on an Apple GPU
    runs-on: macos-latest-xlarge
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install the project
        run: uv sync --dev
      - name: TEMPORARY probe of the Metal device
        run: uv run python .github/tmp/metal_probe.py
      - name: Check that Metal can run
        # NOTE: check_device raises if Metal cannot sample here, so a runner without a
        # usable Apple GPU fails the release instead of skipping the tests below.
        run: >-
          uv run python -c
          "from tsim.statevector.metal import runtime;
          runtime.check_device();
          print('Metal device:', runtime.device().name())"
      - name: Run the Metal tests
        run: uv run pytest test/integration/test_metal_sampler.py

  # TEMPORARY: do the kernels pass on the paravirtual GPU without the Apple7 check?
  experiment:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-latest-xlarge]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --dev
      - run: sed -i '' 's/if not device().supportsFamily_(metal().MTLGPUFamilyApple7):/if False:/' src/tsim/statevector/metal/runtime.py && grep -n "if False" src/tsim/statevector/metal/runtime.py
      - run: uv run python -c "from tsim.statevector.metal import runtime; print(runtime.unavailable() or 'available')"
      - run: uv run pytest test/integration/test_metal_sampler.py -q -rs --durations=5
