[project]
name = "tsim-dev"
version = "0.1.0"
description = "Development CLI for Tsim: capped jobs, tests, benchmarks and profiles. Not published."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tsim-dev = "tsim_dev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tsim_dev"]
