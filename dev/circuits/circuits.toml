# Benchmark circuits for `tsim-dev bench`. One family per row of the quick suite.
# sampler: "detector" or "measurement". postselect: "all" (every detector) or "none".
# suite: "quick" circuits run by default; `--suite full` adds the rest.

[cultivation_d3]
file = "cultivation_d3.stim"
sampler = "detector"
postselect = "all"
suite = "quick"

[cultivation_d5]
file = "cultivation_d5.stim"
sampler = "detector"
postselect = "all"
suite = "quick"

[distillation_d5]
file = "distillation_d5.stim"
sampler = "detector"
postselect = "none"
suite = "quick"

[coherent_d3_r3]
file = "coherent_d3_r3.stim"
sampler = "detector"
postselect = "none"
suite = "quick"

[qv_q10]
file = "qv_q10.stim"
sampler = "measurement"
postselect = "none"
suite = "quick"

[surface_d7_r7]
file = "surface_d7_r7.stim"
sampler = "detector"
postselect = "none"
suite = "quick"

[distillation_d3]
file = "distillation_d3.stim"
sampler = "detector"
postselect = "all"
suite = "full"

[coherent_d5_r5]
file = "coherent_d5_r5.stim"
sampler = "detector"
postselect = "none"
suite = "full"

[cultivation_d5_unselected]
file = "cultivation_d5.stim"
sampler = "detector"
postselect = "none"
suite = "full"
